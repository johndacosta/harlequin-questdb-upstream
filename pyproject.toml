[project]
name = "harlequin-questdb"
version = "0.4.0"
description = "A Harlequin adapter for QuestDB."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Rik Huygen" },
    { name = "John DaCosta", email = "john.dacosta@gmail.com" },
]
keywords = ["sql", "tui", "harlequin", "questdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "harlequin>=2.5,<3",
    "psycopg[binary,pool]>=3.2.0,<4",
]

[project.urls]
Repository = "https://github.com/rhuygen/harlequin-questdb"
Documentation = "https://harlequin.sh"

[project.entry-points."harlequin.adapter"]
questdb = "harlequin_questdb:QuestDBAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harlequin_questdb"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "mypy>=1.7",
    "ruff>=0.4",
]

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/**/*.py", "tests/**/*.py"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: opens a connection to QuestDB on the published defaults",
]
testpaths = ["tests"]
